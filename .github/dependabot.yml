# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — keeps dependencies and CI actions up to date
# ─────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  # npm packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 10
    reviewers:
      - RoMe-me
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - ci
    commit-message:
      prefix: 'ci'
